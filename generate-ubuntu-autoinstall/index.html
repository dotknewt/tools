<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubuntu Autoinstall Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #14171f;
            --surface-2: #1c2030;
            --surface-3: #252a3d;
            --border: rgba(255, 255, 255, 0.07);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #e8eaf0;
            --text-muted: #9298a8;
            --text-dim: #5c6275;
            --accent: #f6ad55;
            --accent-dim: rgba(246, 173, 85, 0.12);
            --accent-border: rgba(246, 173, 85, 0.30);
            --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.55;
            min-height: 100vh;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
        }

        .back {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.15s;
        }
        .back:hover { color: var(--accent); }

        .sep { color: var(--text-dim); }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .header-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-sm);
            padding: 2px 7px;
            letter-spacing: 0.06em;
        }

        .header-filename {
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-dim);
            letter-spacing: 0.04em;
        }

        .workspace {
            display: grid;
            grid-template-columns: 400px 1fr;
            height: calc(100vh - 49px);
        }

        @media (max-width: 860px) {
            .workspace { grid-template-columns: 1fr; height: auto; }
            .output-panel { min-height: 400px; border-top: 1px solid var(--border); border-left: none; }
        }

        .form-panel {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .sec-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface);
            cursor: pointer;
            user-select: none;
        }
        .sec-head:hover { background: var(--surface-2); }

        .sec-num {
            font-family: var(--font-mono);
            font-size: 9.5px;
            color: var(--accent);
            letter-spacing: 0.08em;
            width: 16px;
        }

        .sec-name {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            flex: 1;
        }

        .sec-chevron {
            color: var(--text-dim);
            font-size: 10px;
            transition: transform 0.18s;
        }

        .section.collapsed .sec-chevron { transform: rotate(-90deg); }
        .section.collapsed .sec-body { display: none; }

        .sec-body {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .field { display: flex; flex-direction: column; gap: 5px; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        .hint {
            font-size: 10.5px;
            color: var(--text-dim);
            line-height: 1.45;
            font-family: var(--font-mono);
        }

        input[type="text"], select, textarea {
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 12.5px;
            padding: 7px 10px;
            outline: none;
            width: 100%;
            transition: border-color 0.15s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-border); }
        select option { background: var(--surface-2); }

        textarea {
            font-family: var(--font-mono);
            font-size: 11.5px;
            resize: vertical;
            min-height: 72px;
            line-height: 1.6;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .toggle {
            appearance: none;
            -webkit-appearance: none;
            width: 34px;
            height: 18px;
            background: var(--surface-3);
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: background 0.18s, border-color 0.18s;
        }
        .toggle::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 12px; height: 12px;
            background: var(--text-dim);
            border-radius: 50%;
            transition: transform 0.18s, background 0.18s;
        }
        .toggle:checked { background: var(--accent-dim); border-color: var(--accent-border); }
        .toggle:checked::after { transform: translateX(16px); background: var(--accent); }

        .toggle-label { font-size: 12.5px; color: var(--text-muted); cursor: pointer; }

        .gen-btn {
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-md);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            padding: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            transition: background 0.15s, border-color 0.15s;
        }
        .gen-btn:hover { background: rgba(246,173,85,0.2); border-color: rgba(246,173,85,0.5); }

        .output-panel {
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
        }

        .out-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .out-title {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--text-dim);
            flex: 1;
        }

        .out-btn {
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 9px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .out-btn:hover { color: var(--text); border-color: var(--border-strong); }
        .out-btn.flash { color: var(--accent); border-color: var(--accent-border); background: var(--accent-dim); }

        pre#output {
            flex: 1;
            overflow: auto;
            padding: 18px 20px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.75;
            color: var(--text);
            white-space: pre;
            background: transparent;
            tab-size: 2;
        }

        .ph { color: var(--text-dim); font-style: italic; }
    </style>
</head>
<body>
    <header class="header">
        <a href="../" class="back">← hub</a>
        <span class="sep">/</span>
        <span class="header-title">Ubuntu Autoinstall Generator</span>
        <span class="header-badge">Ubuntu</span>
        <span class="header-filename">autoinstall.yaml</span>
    </header>

    <div class="workspace">
        <div class="form-panel">

            <div class="section" id="s-identity">
                <div class="sec-head" onclick="toggleSec('s-identity')">
                    <span class="sec-num">01</span>
                    <span class="sec-name">Identity</span>
                    <span class="sec-chevron">▾</span>
                </div>
                <div class="sec-body">
                    <div class="row">
                        <div class="field">
                            <label for="hostname">Hostname</label>
                            <input type="text" id="hostname" value="ubuntu-server">
                        </div>
                        <div class="field">
                            <label for="username">Username</label>
                            <input type="text" id="username" value="ubuntu">
                        </div>
                    </div>
                    <div class="field">
                        <label for="realname">Full name <span style="color:var(--text-dim);font-weight:400">(optional)</span></label>
                        <input type="text" id="realname" placeholder="Ubuntu User">
                    </div>
                    <div class="field">
                        <label for="password">Password hash</label>
                        <input type="text" id="password" placeholder="$6$rounds=4096$salt$hash...">
                        <span class="hint">openssl passwd -6 'yourpassword'</span>
                    </div>
                </div>
            </div>

            <div class="section" id="s-locale">
                <div class="sec-head" onclick="toggleSec('s-locale')">
                    <span class="sec-num">02</span>
                    <span class="sec-name">Locale & Keyboard</span>
                    <span class="sec-chevron">▾</span>
                </div>
                <div class="sec-body">
                    <div class="row">
                        <div class="field">
                            <label for="locale">Locale</label>
                            <input type="text" id="locale" value="en_US.UTF-8">
                        </div>
                        <div class="field">
                            <label for="timezone">Timezone</label>
                            <input type="text" id="timezone" value="UTC">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="kb-layout">Keyboard layout</label>
                            <input type="text" id="kb-layout" value="us">
                        </div>
                        <div class="field">
                            <label for="kb-variant">Variant <span style="color:var(--text-dim);font-weight:400">(optional)</span></label>
                            <input type="text" id="kb-variant" placeholder="">
                        </div>
                    </div>
                </div>
            </div>

            <div class="section" id="s-storage">
                <div class="sec-head" onclick="toggleSec('s-storage')">
                    <span class="sec-num">03</span>
                    <span class="sec-name">Storage</span>
                    <span class="sec-chevron">▾</span>
                </div>
                <div class="sec-body">
                    <div class="field">
                        <label for="storage-layout">Layout preset</label>
                        <select id="storage-layout" onchange="onStorageChange()">
                            <option value="direct">Entire disk — direct (no LVM)</option>
                            <option value="lvm" selected>Entire disk + LVM</option>
                            <option value="zfs">Entire disk + ZFS</option>
                            <option value="none">None (omit — manual config)</option>
                        </select>
                    </div>
                    <div class="field" id="disk-field">
                        <label for="disk-match">Target disk</label>
                        <select id="disk-match" onchange="onDiskChange()">
                            <option value="largest">Largest disk (default)</option>
                            <option value="sda">sda</option>
                            <option value="sdb">sdb</option>
                            <option value="nvme0n1">nvme0n1</option>
                            <option value="vda">vda</option>
                            <option value="custom">Custom…</option>
                        </select>
                    </div>
                    <div class="field" id="disk-custom-field" style="display:none">
                        <label for="disk-custom">Disk name</label>
                        <input type="text" id="disk-custom" placeholder="vdb">
                    </div>
                </div>
            </div>

            <div class="section" id="s-ssh">
                <div class="sec-head" onclick="toggleSec('s-ssh')">
                    <span class="sec-num">04</span>
                    <span class="sec-name">SSH</span>
                    <span class="sec-chevron">▾</span>
                </div>
                <div class="sec-body">
                    <div class="field">
                        <div class="toggle-row">
                            <input type="checkbox" class="toggle" id="ssh-install" checked>
                            <label class="toggle-label" for="ssh-install">Install OpenSSH server</label>
                        </div>
                    </div>
                    <div class="field">
                        <div class="toggle-row">
                            <input type="checkbox" class="toggle" id="ssh-allow-pw">
                            <label class="toggle-label" for="ssh-allow-pw">Allow password authentication</label>
                        </div>
                    </div>
                    <div class="field">
                        <label for="ssh-keys">Authorized keys <span style="color:var(--text-dim);font-weight:400">(one per line)</span></label>
                        <textarea id="ssh-keys" placeholder="ssh-ed25519 AAAA..."></textarea>
                    </div>
                </div>
            </div>

            <div class="section" id="s-packages">
                <div class="sec-head" onclick="toggleSec('s-packages')">
                    <span class="sec-num">05</span>
                    <span class="sec-name">Packages & Updates</span>
                    <span class="sec-chevron">▾</span>
                </div>
                <div class="sec-body">
                    <div class="field">
                        <label for="packages">Packages <span style="color:var(--text-dim);font-weight:400">(one per line)</span></label>
                        <textarea id="packages" placeholder="curl&#10;git&#10;vim"></textarea>
                    </div>
                    <div class="field">
                        <label for="updates">Install updates</label>
                        <select id="updates">
                            <option value="security" selected>Security only</option>
                            <option value="all">All updates</option>
                            <option value="none">None</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section" id="s-advanced">
                <div class="sec-head" onclick="toggleSec('s-advanced')">
                    <span class="sec-num">06</span>
                    <span class="sec-name">Advanced</span>
                    <span class="sec-chevron">▾</span>
                </div>
                <div class="sec-body">
                    <div class="field">
                        <label for="late-commands">Late commands <span style="color:var(--text-dim);font-weight:400">(one per line)</span></label>
                        <textarea id="late-commands" placeholder="curtin in-target -- apt-get install -y vim&#10;curtin in-target -- systemctl enable myservice"></textarea>
                    </div>
                    <div class="field">
                        <label for="shutdown">After install</label>
                        <select id="shutdown">
                            <option value="reboot" selected>Reboot</option>
                            <option value="poweroff">Power off</option>
                        </select>
                    </div>
                </div>
            </div>

            <button class="gen-btn" onclick="generate()">Generate autoinstall.yaml</button>

        </div>

        <div class="output-panel">
            <div class="out-header">
                <span class="out-title">Output</span>
                <button class="out-btn" id="copy-btn" onclick="copyOut()">Copy</button>
                <button class="out-btn" onclick="downloadOut()">Download</button>
            </div>
            <pre id="output"><span class="ph"># Fill in the form and click Generate</span></pre>
        </div>
    </div>

    <script>
        function toggleSec(id) {
            document.getElementById(id).classList.toggle('collapsed');
        }

        function onStorageChange() {
            const v = document.getElementById('storage-layout').value;
            document.getElementById('disk-field').style.display = v === 'none' ? 'none' : 'flex';
            document.getElementById('disk-field').style.flexDirection = 'column';
        }

        function onDiskChange() {
            const v = document.getElementById('disk-match').value;
            document.getElementById('disk-custom-field').style.display = v === 'custom' ? 'flex' : 'none';
            document.getElementById('disk-custom-field').style.flexDirection = v === 'custom' ? 'column' : '';
        }

        function g(id) { return document.getElementById(id); }
        function v(id) { return g(id).value.trim(); }
        function ck(id) { return g(id).checked; }
        function lines(id) { return v(id).split('\n').map(s => s.trim()).filter(Boolean); }

        function generate() {
            const cfg = { version: 1 };

            // Identity
            const hostname = v('hostname'), username = v('username'),
                  password = v('password'), realname = v('realname');
            if (hostname || username || password) {
                cfg.identity = {};
                if (hostname)  cfg.identity.hostname = hostname;
                if (username)  cfg.identity.username = username;
                if (realname)  cfg.identity.realname = realname;
                if (password)  cfg.identity.password = password;
            }

            // Locale
            const locale = v('locale');
            if (locale) cfg.locale = locale;

            // Keyboard
            const kbLayout = v('kb-layout'), kbVariant = v('kb-variant');
            if (kbLayout) {
                cfg.keyboard = { layout: kbLayout };
                if (kbVariant) cfg.keyboard.variant = kbVariant;
            }

            // Timezone
            const tz = v('timezone');
            if (tz) cfg.timezone = tz;

            // Storage
            const storagePreset = v('storage-layout');
            if (storagePreset !== 'none') {
                const diskSel = v('disk-match');
                const diskName = diskSel === 'custom' ? v('disk-custom') : diskSel;
                const layout = { name: storagePreset };
                if (diskName && diskName !== 'largest') layout.match = { name: diskName };
                cfg.storage = { layout };
            }

            // SSH
            const sshInstall = ck('ssh-install');
            const sshAllowPw = ck('ssh-allow-pw');
            const sshKeys = lines('ssh-keys');
            if (sshInstall || sshKeys.length) {
                cfg.ssh = { 'install-server': sshInstall, 'allow-pw': sshAllowPw };
                if (sshKeys.length) cfg.ssh['authorized-keys'] = sshKeys;
            }

            // Packages
            const pkgs = lines('packages');
            if (pkgs.length) cfg.packages = pkgs;

            // Updates
            const upd = v('updates');
            if (upd !== 'none') cfg.updates = upd;

            // Late commands
            const late = lines('late-commands');
            if (late.length) cfg['late-commands'] = late;

            // Shutdown
            cfg.shutdown = v('shutdown');

            g('output').textContent = toYAML(cfg);
        }

        function toYAML(obj, depth) {
            depth = depth || 0;
            const pad = '  '.repeat(depth);
            const out = [];
            for (const [k, val] of Object.entries(obj)) {
                if (val === undefined || val === null) continue;
                const key = /^[a-zA-Z_][a-zA-Z0-9_-]*$/.test(k) ? k : "'" + k + "'";
                if (typeof val === 'boolean') {
                    out.push(pad + key + ': ' + val);
                } else if (typeof val === 'number') {
                    out.push(pad + key + ': ' + val);
                } else if (typeof val === 'string') {
                    out.push(pad + key + ': ' + yStr(val));
                } else if (Array.isArray(val)) {
                    if (!val.length) { out.push(pad + key + ': []'); continue; }
                    out.push(pad + key + ':');
                    for (const item of val) {
                        if (typeof item === 'string') {
                            out.push(pad + '  - ' + yStr(item));
                        } else if (item && typeof item === 'object') {
                            const sub = toYAML(item, depth + 2).split('\n');
                            out.push(pad + '  - ' + sub[0].trimStart());
                            for (const sl of sub.slice(1)) out.push(pad + '    ' + sl.trimStart());
                        }
                    }
                } else if (typeof val === 'object') {
                    out.push(pad + key + ':');
                    out.push(toYAML(val, depth + 1));
                }
            }
            return out.join('\n');
        }

        function yStr(s) {
            if (s === '') return "''";
            if (/^(true|false|yes|no|on|off|null|~)$/i.test(s) ||
                /^\d/.test(s) ||
                /[:#\[\]{}&*!,|>'"?%@`]/.test(s) ||
                s.startsWith(' ') || s.endsWith(' ') || s.includes('\n')) {
                return "'" + s.replace(/'/g, "''") + "'";
            }
            return s;
        }

        function copyOut() {
            const text = g('output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = g('copy-btn');
                btn.textContent = 'Copied!';
                btn.classList.add('flash');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('flash'); }, 1500);
            });
        }

        function downloadOut() {
            const blob = new Blob([g('output').textContent], { type: 'text/yaml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'autoinstall.yaml';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        generate();
    </script>
</body>
</html>
