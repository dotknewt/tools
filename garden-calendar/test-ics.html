<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICS Sanity Check</title>
  <script src="data/activities.js"></script>
  <script src="data/plants.js"></script>
  <script src="js/ics.js"></script>
  <style>
    body { font-family: monospace; padding: 1rem; background: #1a1a1a; color: #d4d4d4; }
    pre { white-space: pre-wrap; word-break: break-all; background: #111; padding: 1rem; border: 1px solid #444; }
    .pass { color: #6dbf67; }
    .fail { color: #e06c75; }
    h2 { color: #c89b3c; }
  </style>
</head>
<body>
<h2>ICS Engine Sanity Check</h2>
<div id="results"></div>
<h2>Sample Output</h2>
<pre id="output"></pre>

<script>
(function () {
  const results = document.getElementById("results");
  const output = document.getElementById("output");

  function check(label, passed) {
    const el = document.createElement("p");
    el.className = passed ? "pass" : "fail";
    el.textContent = (passed ? "✓ " : "✗ ") + label;
    results.appendChild(el);
    if (!passed) console.error("FAIL:", label);
    return passed;
  }

  // ── Build a sample calendar with 3 events ──────────────────────────────────
  const zelkova = GARDEN_PLANTS.find(p => p.id === "zelkova-serrata");
  const maple   = GARDEN_PLANTS.find(p => p.id === "acer-palmatum");
  const tomato  = GARDEN_PLANTS.find(p => p.id === "solanum-lycopersicum");

  const pruneAct  = GARDEN_ACTIVITIES.bonsai.find(a => a.id === "prune");
  const wireAct   = GARDEN_ACTIVITIES.bonsai.find(a => a.id === "wire");
  const harvestAct = GARDEN_ACTIVITIES["vegetables-herbs"].find(a => a.id === "harvest");

  const events = [
    { plant: zelkova, activity: pruneAct,  offsetDays: 0,  zoneLabel: "Zone 6 (baseline)", rruleYearly: false },
    { plant: maple,   activity: wireAct,   offsetDays: 0,  zoneLabel: "Zone 6 (baseline)", rruleYearly: true  },
    { plant: tomato,  activity: harvestAct,offsetDays: 10, zoneLabel: "Zone 5 (+10 days)", rruleYearly: false,
      manualStart: "2026-08-01", manualEnd: "2026-10-20" },
  ];

  const ics = window.ICS.buildCalendar(events);
  output.textContent = ics;

  // ── RFC 5545 checks ────────────────────────────────────────────────────────
  check("Starts with BEGIN:VCALENDAR",   ics.startsWith("BEGIN:VCALENDAR"));
  check("Ends with END:VCALENDAR",       ics.trimEnd().endsWith("END:VCALENDAR"));
  check("Has VERSION:2.0",              ics.includes("VERSION:2.0"));
  check("Has PRODID",                   ics.includes("PRODID:"));
  check("Has CALSCALE:GREGORIAN",       ics.includes("CALSCALE:GREGORIAN"));

  check("3 BEGIN:VEVENT",               (ics.match(/BEGIN:VEVENT/g) || []).length === 3);
  check("3 END:VEVENT",                 (ics.match(/END:VEVENT/g)   || []).length === 3);
  check("Has DTSTAMP on each event",    (ics.match(/DTSTAMP:/g)     || []).length === 3);
  check("Has DTSTART;VALUE=DATE",       ics.includes("DTSTART;VALUE=DATE:"));
  check("Has DTEND;VALUE=DATE",         ics.includes("DTEND;VALUE=DATE:"));

  // All-day exclusive end: DTEND should be DTSTART + at least 1 day
  const starts = [...ics.matchAll(/DTSTART;VALUE=DATE:(\d{8})/g)].map(m => m[1]);
  const ends   = [...ics.matchAll(/DTEND;VALUE=DATE:(\d{8})/g)].map(m => m[1]);
  check("DTEND > DTSTART for all events", starts.every((s, i) => ends[i] > s));

  // UIDs are unique
  const uids = [...ics.matchAll(/UID:([^\r\n]+)/g)].map(m => m[1].trim());
  check("All UIDs unique", new Set(uids).size === uids.length);
  check("UIDs end with @garden-cal", uids.every(u => u.endsWith("@garden-cal")));

  // RRULE present only for maple wire event
  check("RRULE:FREQ=YEARLY present (1 event)", (ics.match(/RRULE:FREQ=YEARLY/g) || []).length === 1);

  // CRLF line endings only
  const lf = (ics.match(/(?<!\r)\n/g) || []).length;
  check("No bare LF (all CRLF)", lf === 0);

  // No line exceeds 75 octets (after folding)
  const lines = ics.split("\r\n");
  const longLines = lines.filter(l => new TextEncoder().encode(l).length > 75);
  check("No line > 75 octets", longLines.length === 0);
  if (longLines.length > 0) {
    console.warn("Long lines:", longLines);
  }

  // Manual override applied for tomato harvest
  check("Manual start date used (2026-08-01 → 20260801)", ics.includes("DTSTART;VALUE=DATE:20260801"));
  check("Manual end date used (2026-10-20 → DTEND 20261021)", ics.includes("DTEND;VALUE=DATE:20261021"));

  // Empty calendar
  const emptyIcs = window.ICS.buildCalendar([]);
  check("Empty calendar: no stray blank lines", !emptyIcs.includes("\r\n\r\n"));
  check("Empty calendar: valid shell", emptyIcs.includes("BEGIN:VCALENDAR") && emptyIcs.includes("END:VCALENDAR"));

  console.log("=== SAMPLE ICS ===\n" + ics);
})();
</script>
</body>
</html>
