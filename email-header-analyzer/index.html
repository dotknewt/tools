<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Header Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #14171f;
            --surface-2: #1c2030;
            --surface-3: #252a3d;
            --border: rgba(255, 255, 255, 0.07);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #e8eaf0;
            --text-muted: #9298a8;
            --text-dim: #5c6275;
            --accent: #b794f6;
            --accent-dim: rgba(183, 148, 246, 0.12);
            --accent-border: rgba(183, 148, 246, 0.30);
            --ok: #4fd1c5;
            --ok-dim: rgba(79, 209, 197, 0.12);
            --ok-border: rgba(79, 209, 197, 0.30);
            --bad: #ef6b6b;
            --bad-dim: rgba(239, 107, 107, 0.12);
            --bad-border: rgba(239, 107, 107, 0.30);
            --amber: #f6ad55;
            --amber-dim: rgba(246, 173, 85, 0.12);
            --amber-border: rgba(246, 173, 85, 0.30);
            --blue: #63b3ed;
            --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.55;
            min-height: 100vh;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
        }

        .back {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.15s;
        }
        .back:hover { color: var(--accent); }

        .sep { color: var(--text-dim); }
        .header-title { font-size: 14px; font-weight: 600; color: var(--text); }

        .header-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-sm);
            padding: 2px 7px;
            letter-spacing: 0.06em;
        }

        .header-note {
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-dim);
            letter-spacing: 0.04em;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(340px, 42%) 1fr;
            height: calc(100vh - 49px);
        }

        @media (max-width: 860px) {
            .workspace { grid-template-columns: 1fr; height: auto; }
            .results-panel { border-left: none; border-top: 1px solid var(--border); min-height: 400px; }
            .input-panel textarea { min-height: 220px; }
        }

        .input-panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .panel-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .panel-title {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--text-dim);
            flex: 1;
        }

        .btn {
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 9px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-3); }

        #input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.6;
            padding: 16px 18px;
        }
        #input::placeholder { color: var(--text-dim); }

        .results-panel { display: flex; flex-direction: column; overflow: hidden; }

        .results-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-note {
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-style: italic;
            padding: 24px;
            text-align: center;
        }

        .status-row { display: flex; flex-wrap: wrap; gap: 8px; }

        .chip {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: 0.05em;
            border-radius: var(--radius-sm);
            padding: 3px 9px;
            border: 1px solid var(--border-strong);
            background: var(--surface-2);
            color: var(--text-muted);
        }
        .chip.ok   { color: var(--ok);    background: var(--ok-dim);    border-color: var(--ok-border); }
        .chip.bad  { color: var(--bad);   background: var(--bad-dim);   border-color: var(--bad-border); }
        .chip.warn { color: var(--amber); background: var(--amber-dim); border-color: var(--amber-border); }

        .sect {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--surface);
            overflow: hidden;
        }

        .sect-head {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        .sect-name {
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            flex: 1;
        }
        .sect-name .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; }

        .sect-count {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            border-radius: 9px;
            padding: 1px 8px;
        }

        .sect-body { padding: 10px 12px; }

        table.kv { width: 100%; border-collapse: collapse; }
        table.kv td {
            padding: 6px 8px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            vertical-align: top;
        }
        table.kv tr:first-child td { border-top: none; }
        td.kv-key {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            white-space: nowrap;
            width: 1%;
        }
        td.kv-val { font-family: var(--font-mono); font-size: 11.5px; word-break: break-all; }
        td.kv-val .sub { color: var(--text-dim); }

        /* checks list */
        ul.checks { list-style: none; }
        ul.checks li {
            display: flex;
            gap: 9px;
            padding: 5px 0;
            font-size: 12.5px;
            align-items: baseline;
        }
        ul.checks .mark { font-family: var(--font-mono); font-size: 12px; flex-shrink: 0; }
        ul.checks li.ok .mark   { color: var(--ok); }
        ul.checks li.bad .mark  { color: var(--bad); }
        ul.checks li.warn .mark { color: var(--amber); }
        ul.checks li.info .mark { color: var(--text-dim); }
        ul.checks code { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

        /* received hops */
        .hop {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            border-top: 1px solid var(--border);
        }
        .hop:first-child { border-top: none; }

        .hop-num {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .hop-body { flex: 1; min-width: 0; }
        .hop-route { font-family: var(--font-mono); font-size: 11.5px; word-break: break-all; line-height: 1.6; }
        .hop-route .lbl { color: var(--text-dim); }
        .hop-meta {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-dim);
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .hop-delay { color: var(--ok); }
        .hop-delay.slow { color: var(--amber); }
        .hop-delay.neg { color: var(--bad); }
        .hop-ip { color: var(--blue); }

        /* raw header table */
        table.raw { width: 100%; border-collapse: collapse; }
        table.raw td {
            padding: 4px 8px;
            border-top: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 10.5px;
            vertical-align: top;
        }
        table.raw tr:first-child td { border-top: none; }
        td.raw-name { color: var(--accent); white-space: nowrap; width: 1%; }
        td.raw-val { color: var(--text-muted); word-break: break-all; }

        details.fold > summary {
            cursor: pointer;
            list-style: none;
            user-select: none;
        }
        details.fold > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body>
    <header class="header">
        <a href="../" class="back">← hub</a>
        <span class="sep">/</span>
        <span class="header-title">Email Header Analyzer</span>
        <span class="header-badge">DFIR</span>
        <span class="header-note">nothing leaves this page</span>
    </header>

    <div class="workspace">
        <div class="input-panel">
            <div class="panel-head">
                <span class="panel-title">Paste raw headers</span>
                <button class="btn" onclick="loadSample()">Sample</button>
                <button class="btn" onclick="clearInput()">Clear</button>
            </div>
            <textarea id="input" spellcheck="false"
                placeholder="Paste the full raw message source or just the headers (View source / Show original in your mail client).

A full .eml works too — analysis stops at the first blank line. Everything runs locally as you type."></textarea>
        </div>

        <div class="results-panel">
            <div class="panel-head">
                <span class="panel-title">Analysis</span>
            </div>
            <div class="results-body" id="results">
                <div class="empty-note">No headers yet — paste raw message headers on the left.</div>
            </div>
        </div>
    </div>

    <script>
        const SAMPLE = `Delivered-To: victim@corporate-example.com
Received: by mx.corporate-example.com with SMTP id x94mb2213756qkj;
        Mon, 23 Jun 2025 14:03:12 -0700 (PDT)
Authentication-Results: mx.corporate-example.com;
       spf=pass smtp.mailfrom=notices.example-bank.com;
       dkim=pass header.d=notices.example-bank.com header.s=s1;
       dmarc=pass (p=REJECT) header.from=notices.example-bank.com
Received: from mail-out.notices.example-bank.com (mail-out.notices.example-bank.com. [198.51.100.25])
        by mx.corporate-example.com with ESMTPS id b7si9871234qtx.112
        for <victim@corporate-example.com>;
        Mon, 23 Jun 2025 14:03:10 -0700 (PDT)
Received: from app-01.prod.internal (unknown [10.4.2.17])
        by mail-out.notices.example-bank.com (Postfix) with ESMTP id 4bQqZx1yGkz;
        Mon, 23 Jun 2025 21:03:07 +0000 (UTC)
DKIM-Signature: v=1; a=rsa-sha256; c=relaxed/relaxed; d=notices.example-bank.com;
        s=s1; t=1750712587; h=from:to:subject:date:message-id:mime-version;
        bh=frcCV1k9oG9oKj3dpUqdJg1PxRT2RSN/XKdLCPjaYaY=;
        b=dGhpcyBpcyBub3QgYSByZWFsIHNpZ25hdHVyZSwganVzdCBzYW1wbGUgZGF0YQ==
From: "Example Bank" <alerts@notices.example-bank.com>
Reply-To: "Example Bank Support" <support@examp1e-bank-secure.com>
To: <victim@corporate-example.com>
Subject: =?UTF-8?B?QWNjb3VudCBub3RpY2U6IHZlcmlmeSB5b3VyIGRldGFpbHM=?=
Date: Mon, 23 Jun 2025 21:03:06 +0000
Message-ID: <20250623210306.4bQqZx1yGkz@notices.example-bank.com>
MIME-Version: 1.0
Content-Type: multipart/alternative; boundary="0000000000009e2a3f0638a1b2c4"
X-Mailer: MassMailPro 4.2
List-Unsubscribe: <mailto:unsub@notices.example-bank.com>`;

        // ── parsing ─────────────────────────────────────────────
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function parseHeaders(raw) {
            const text = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            // stop at first blank line (start of body)
            const blank = text.search(/\n\s*\n/);
            const head = blank === -1 ? text : text.slice(0, blank);
            const hdrs = [];
            for (const line of head.split('\n')) {
                if (/^[ \t]/.test(line) && hdrs.length) {
                    hdrs[hdrs.length - 1].value += ' ' + line.trim();
                } else {
                    const m = line.match(/^([!-9;-~]+):\s*(.*)$/);
                    if (m) hdrs.push({ name: m[1], value: m[2] });
                }
            }
            return hdrs;
        }

        function get(hdrs, name) {
            const h = hdrs.find(h => h.name.toLowerCase() === name.toLowerCase());
            return h ? h.value : null;
        }
        function getAll(hdrs, name) {
            return hdrs.filter(h => h.name.toLowerCase() === name.toLowerCase()).map(h => h.value);
        }

        // RFC 2047 encoded-word decoding
        function decodeWords(s) {
            if (!s) return s;
            // adjacent encoded words: whitespace between them is dropped
            s = s.replace(/(\?=)\s+(=\?)/g, '$1$2');
            return s.replace(/=\?([^?]+)\?([bBqQ])\?([^?]*)\?=/g, (m, charset, enc, data) => {
                try {
                    let bytes;
                    if (enc.toLowerCase() === 'b') {
                        bytes = Uint8Array.from(atob(data), c => c.charCodeAt(0));
                    } else {
                        const q = data.replace(/_/g, ' ');
                        const arr = [];
                        for (let i = 0; i < q.length; i++) {
                            if (q[i] === '=' && i + 2 < q.length + 1) {
                                arr.push(parseInt(q.substr(i + 1, 2), 16));
                                i += 2;
                            } else arr.push(q.charCodeAt(i));
                        }
                        bytes = Uint8Array.from(arr);
                    }
                    let dec;
                    try { dec = new TextDecoder(charset.toLowerCase()); }
                    catch { dec = new TextDecoder('utf-8'); }
                    return dec.decode(bytes);
                } catch { return m; }
            });
        }

        function parseAddr(v) {
            if (!v) return null;
            v = decodeWords(v);
            const angle = v.match(/<([^>]*)>/);
            const addr = angle ? angle[1].trim() : (v.match(/[\w.+%-]+@[\w.-]+/) || [''])[0];
            let name = angle ? v.slice(0, angle.index).trim() : '';
            name = name.replace(/^"|"$/g, '').trim();
            return { name, addr, domain: addr.includes('@') ? addr.slice(addr.lastIndexOf('@') + 1).toLowerCase().replace(/>$/, '') : '' };
        }

        // org-level (relaxed) domain alignment
        function aligned(a, b) {
            if (!a || !b) return false;
            a = a.toLowerCase(); b = b.toLowerCase();
            return a === b || a.endsWith('.' + b) || b.endsWith('.' + a);
        }

        function parseReceived(v) {
            const semi = v.lastIndexOf(';');
            let date = null;
            if (semi !== -1) {
                const ds = v.slice(semi + 1).replace(/\(.*?\)/g, '').trim();
                const d = new Date(ds);
                if (!isNaN(d)) date = d;
            }
            const body = semi !== -1 ? v.slice(0, semi) : v;
            const grab = (kw) => {
                const m = body.match(new RegExp('(?:^|\\s)' + kw + '\\s+(.+?)(?=\\s+(?:from|by|via|with|id|for)\\s|$)', 'i'));
                return m ? m[1].trim() : null;
            };
            const ips = [];
            for (const m of body.matchAll(/\[(?:IPv6:)?([0-9a-fA-F:.]+)\]/g)) ips.push(m[1]);
            for (const m of body.matchAll(/\b((?:\d{1,3}\.){3}\d{1,3})\b/g)) if (!ips.includes(m[1])) ips.push(m[1]);
            return { from: grab('from'), by: grab('by'), with: (body.match(/\bwith\s+([^\s;]+)/i) || [])[1] || null, date, ips, raw: v };
        }

        function isPrivateIP(ip) {
            return /^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|127\.|169\.254\.)/.test(ip) || ip === '::1' || /^f[cd]/i.test(ip);
        }

        function fmtDelay(ms) {
            const neg = ms < 0;
            let s = Math.abs(ms) / 1000;
            const parts = [];
            const units = [[86400, 'd'], [3600, 'h'], [60, 'm']];
            for (const [size, label] of units) {
                if (s >= size) { parts.push(Math.floor(s / size) + label); s %= size; }
            }
            parts.push((parts.length ? Math.floor(s) : Math.round(s * 10) / 10) + 's');
            return (neg ? '-' : '+') + parts.slice(0, 2).join(' ');
        }

        const AUTH_GOOD = new Set(['pass']);
        const AUTH_BAD = new Set(['fail', 'permerror', 'discard', 'reject']);

        function authClass(result) {
            const r = result.toLowerCase();
            if (AUTH_GOOD.has(r)) return 'ok';
            if (AUTH_BAD.has(r)) return 'bad';
            return 'warn';  // softfail / neutral / none / temperror / bestguesspass...
        }

        // ── analysis + render ───────────────────────────────────
        function section(color, name, body, count = null) {
            const badge = count !== null ? `<span class="sect-count">${count}</span>` : '';
            return `<div class="sect">
                <div class="sect-head"><span class="sect-name"><span class="dot" style="background:${color}"></span>${name}</span>${badge}</div>
                <div class="sect-body">${body}</div>
            </div>`;
        }

        function kvTable(rows) {
            return '<table class="kv">' + rows.filter(r => r[1]).map(([k, v]) =>
                `<tr><td class="kv-key">${esc(k)}</td><td class="kv-val">${v}</td></tr>`).join('') + '</table>';
        }

        function analyze() {
            const raw = document.getElementById('input').value;
            const results = document.getElementById('results');

            if (!raw.trim()) {
                results.innerHTML = '<div class="empty-note">No headers yet — paste raw message headers on the left.</div>';
                return;
            }

            const hdrs = parseHeaders(raw);
            if (!hdrs.length) {
                results.innerHTML = '<div class="empty-note">Could not parse any "Name: value" header lines.</div>';
                return;
            }

            const html = [];

            const from = parseAddr(get(hdrs, 'From'));
            const replyTo = parseAddr(get(hdrs, 'Reply-To'));
            const returnPath = parseAddr(get(hdrs, 'Return-Path'));
            const to = get(hdrs, 'To');
            const subject = decodeWords(get(hdrs, 'Subject') || '');
            const dateHdr = get(hdrs, 'Date');
            const msgId = get(hdrs, 'Message-ID') || get(hdrs, 'Message-Id');
            const msgIdDomain = msgId ? (msgId.match(/@([^>\s]+)/) || [])[1] : null;

            // ── authentication chips ──
            const authChips = [];
            const seenMethods = new Set();
            for (const ar of getAll(hdrs, 'Authentication-Results').concat(getAll(hdrs, 'ARC-Authentication-Results'))) {
                for (const m of ar.matchAll(/\b(spf|dkim|dmarc|arc|compauth)=([a-zA-Z0-9]+)/g)) {
                    const key = m[1].toLowerCase();
                    if (seenMethods.has(key)) continue;   // first (topmost) result wins
                    seenMethods.add(key);
                    authChips.push(`<span class="chip ${authClass(m[2])}">${key}=${esc(m[2].toLowerCase())}</span>`);
                }
            }
            const rspf = get(hdrs, 'Received-SPF');
            if (!seenMethods.has('spf') && rspf) {
                const r = (rspf.match(/^\s*(\w+)/) || [])[1] || '?';
                authChips.push(`<span class="chip ${authClass(r)}">spf=${esc(r.toLowerCase())}</span>`);
            }
            if (!authChips.length)
                authChips.push('<span class="chip warn">no Authentication-Results header</span>');
            html.push(`<div class="status-row">${authChips.join('')}</div>`);

            // ── summary ──
            html.push(section('#b794f6', 'Message', kvTable([
                ['Subject', esc(subject)],
                ['From', from ? esc((from.name ? from.name + ' ' : '') + '<' + from.addr + '>') : null],
                ['Reply-To', replyTo ? esc((replyTo.name ? replyTo.name + ' ' : '') + '<' + replyTo.addr + '>') : null],
                ['Return-Path', returnPath ? esc(returnPath.addr) : null],
                ['To', to ? esc(decodeWords(to)) : null],
                ['Date', dateHdr ? esc(dateHdr) + localTime(dateHdr) : null],
                ['Message-ID', msgId ? esc(msgId) : null],
            ])));

            // ── checks ──
            const checks = [];
            const fromDupes = getAll(hdrs, 'From');
            if (fromDupes.length > 1)
                checks.push(['bad', `Multiple From headers (${fromDupes.length}) — classic header-smuggling / display trick.`]);

            const dkimSigs = getAll(hdrs, 'DKIM-Signature').map(v => {
                const tag = (t) => (v.match(new RegExp('(?:^|;)\\s*' + t + '=([^;]+)', 'i')) || [])[1]?.trim();
                return { d: tag('d'), s: tag('s'), a: tag('a') };
            });

            if (from && returnPath) {
                checks.push(aligned(from.domain, returnPath.domain)
                    ? ['ok', `Return-Path domain <code>${esc(returnPath.domain)}</code> aligns with From domain.`]
                    : ['warn', `Return-Path domain <code>${esc(returnPath.domain)}</code> does not align with From domain <code>${esc(from.domain)}</code> (common for mailing lists / ESPs, but also for spoofing).`]);
            }
            if (from && replyTo && replyTo.addr && replyTo.addr !== from.addr) {
                checks.push(aligned(from.domain, replyTo.domain)
                    ? ['info', `Reply-To differs from From but stays in the same domain.`]
                    : ['bad', `Reply-To <code>${esc(replyTo.addr)}</code> points to a different domain than From <code>${esc(from.domain)}</code> — replies go somewhere else. Frequent BEC/phishing pattern.`]);
            }
            if (from && dkimSigs.length) {
                const match = dkimSigs.some(s => aligned(s.d, from.domain));
                checks.push(match
                    ? ['ok', `A DKIM signature domain (d=) aligns with the From domain.`]
                    : ['warn', `No DKIM signature d= aligns with From domain <code>${esc(from.domain)}</code> (signed by: ${esc(dkimSigs.map(s => s.d).filter(Boolean).join(', ') || 'unknown')}).`]);
            } else if (from && !dkimSigs.length) {
                checks.push(['warn', 'No DKIM-Signature header present.']);
            }
            if (from && msgIdDomain) {
                checks.push(aligned(from.domain, msgIdDomain)
                    ? ['info', `Message-ID domain matches the From domain.`]
                    : ['info', `Message-ID domain <code>${esc(msgIdDomain)}</code> differs from the From domain (often just the sending platform).`]);
            }
            if (!dateHdr) checks.push(['warn', 'No Date header.']);
            if (!msgId) checks.push(['warn', 'No Message-ID header — most legitimate MTAs add one.']);
            const origIP = get(hdrs, 'X-Originating-IP');
            if (origIP) checks.push(['info', `X-Originating-IP: <code>${esc(origIP)}</code>`]);
            const mailer = get(hdrs, 'X-Mailer') || get(hdrs, 'User-Agent');
            if (mailer) checks.push(['info', `Mailer: <code>${esc(decodeWords(mailer))}</code>`]);

            html.push(section('#f6ad55', 'Checks',
                '<ul class="checks">' + checks.map(([cls, msg]) => {
                    const mark = cls === 'ok' ? '✓' : cls === 'bad' ? '✗' : cls === 'warn' ? '!' : '·';
                    return `<li class="${cls}"><span class="mark">${mark}</span><span>${msg}</span></li>`;
                }).join('') + '</ul>'));

            // ── received chain ──
            const received = getAll(hdrs, 'Received').map(parseReceived).reverse();  // oldest first
            if (received.length) {
                let rows = '';
                let firstDate = null, lastDate = null;
                received.forEach((hop, i) => {
                    let delay = '';
                    if (hop.date) {
                        if (!firstDate) firstDate = hop.date;
                        const prev = received.slice(0, i).reverse().find(h => h.date);
                        if (prev) {
                            const ms = hop.date - prev.date;
                            const cls = ms < 0 ? 'neg' : ms > 120000 ? 'slow' : '';
                            delay = `<span class="hop-delay ${cls}">${fmtDelay(ms)}${ms < 0 ? ' ⚠ out of order' : ''}</span>`;
                        } else {
                            delay = '<span class="hop-delay">start</span>';
                        }
                        lastDate = hop.date;
                    }
                    const ipHtml = hop.ips.map(ip =>
                        `<span class="hop-ip">${esc(ip)}${isPrivateIP(ip) ? ' (private)' : ''}</span>`).join(' ');
                    rows += `<div class="hop">
                        <div class="hop-num">${i + 1}</div>
                        <div class="hop-body">
                            <div class="hop-route">${hop.from ? `<span class="lbl">from</span> ${esc(hop.from)} ` : ''}${hop.by ? `<span class="lbl">by</span> ${esc(hop.by)}` : ''}${hop.with ? ` <span class="lbl">with</span> ${esc(hop.with)}` : ''}</div>
                            <div class="hop-meta">
                                ${hop.date ? `<span>${hop.date.toISOString().replace('T', ' ').replace(/\.\d+Z/, ' UTC')}</span>` : '<span>no timestamp</span>'}
                                ${delay}
                                ${ipHtml}
                            </div>
                        </div>
                    </div>`;
                });
                let totalNote = '';
                if (firstDate && lastDate && lastDate - firstDate >= 0)
                    totalNote = ` · total transit ${fmtDelay(lastDate - firstDate).slice(1)}`;
                html.push(section('#63b3ed', `Received Chain <span style="text-transform:none;letter-spacing:0;color:var(--text-dim)">(oldest → newest${totalNote})</span>`, rows, received.length));
            }

            // ── DKIM signatures ──
            if (dkimSigs.length) {
                html.push(section('#4fd1c5', 'DKIM Signatures',
                    dkimSigs.map(s => kvTable([
                        ['domain (d=)', esc(s.d || '?')],
                        ['selector (s=)', esc(s.s || '?')],
                        ['algorithm (a=)', esc(s.a || '?')],
                    ])).join('<div style="height:10px"></div>'), dkimSigs.length));
            }

            // ── all headers ──
            html.push(`<div class="sect"><details class="fold">
                <summary><div class="sect-head" style="border-bottom:none"><span class="sect-name"><span class="dot" style="background:#5c6275"></span>All Headers (click to expand)</span><span class="sect-count">${hdrs.length}</span></div></summary>
                <div class="sect-body" style="border-top:1px solid var(--border)"><table class="raw">` +
                hdrs.map(h => `<tr><td class="raw-name">${esc(h.name)}</td><td class="raw-val">${esc(h.value)}</td></tr>`).join('') +
                '</table></div></details></div>');

            results.innerHTML = html.join('');
        }

        function localTime(dateStr) {
            const d = new Date(dateStr.replace(/\(.*?\)/g, '').trim());
            if (isNaN(d)) return '';
            return `<span class="sub"> · local ${d.toLocaleString()}</span>`;
        }

        // ── UI wiring ───────────────────────────────────────────
        function loadSample() {
            document.getElementById('input').value = SAMPLE;
            analyze();
        }
        function clearInput() {
            document.getElementById('input').value = '';
            analyze();
        }

        let debounce;
        document.getElementById('input').addEventListener('input', () => {
            clearTimeout(debounce);
            debounce = setTimeout(analyze, 250);
        });
    </script>
</body>
</html>
