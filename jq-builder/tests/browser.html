      }, timeout);
      const unsubscribe = app.subscribe((state, status, result) => {
        if (!predicate(state, status, result)) return;
        clearTimeout(timer);
        unsubscribe();
        resolve({ state, status, result });
      });
    });
  }

      constructor() {

        this.terminated = false;
        this.postCount = 0;
        workers.push(this);
      }
      addEventListener(type, listener) { this.listeners[type].push(listener); }
      postMessage(message) { this.postCount += 1; this.request = message; }
      terminate() { this.terminated = true; }

      fail(message) { this.listeners.error.slice().forEach((listener) => listener({ message })); }
    }
    const root = {
      Worker: FakeWorker,
      TextEncoder,
      TextDecoder,
      setTimeout(callback, delay) {
        const timer = { callback, delay, cancelled: false };
        timers.push(timer);
        return timer;
      },
      clearTimeout(timer) { if (timer) timer.cancelled = true; }
    };
    Function('globalThis', coreSource)(root);
    Function('globalThis', controllerSource)(root);
    return {
      app: root.JQApp,
      workers,
      timers,
      fireTimer(timer) { if (timer && !timer.cancelled) timer.callback(); }
    };

      testUi.getElementById('source-path').value = '["records"]'; testUi.getElementById('source-path').dispatchEvent(new verifyFrame.contentWindow.Event('change', { bubbles: true }));
      testUi.getElementById('projection-toggle').click(); testUi.getElementById('add-projection').click();
      let resultAlias = testUi.querySelector('[aria-label="Output field 1 name"]'); resultAlias.value = 'oldName'; resultAlias.dispatchEvent(new verifyFrame.contentWindow.Event('change', { bubbles: true })); resultAlias.value = 'displayName'; resultAlias.dispatchEvent(new verifyFrame.contentWindow.Event('change', { bubbles: true }));
      let resultPath = testUi.querySelector('[aria-label="Output field 1 path"]'); resultPath.value = '["team"]'; resultPath.dispatchEvent(new verifyFrame.contentWindow.Event('change', { bubbles: true })); resultPath.value = '["name"]'; resultPath.dispatchEvent(new verifyFrame.contentWindow.Event('change', { bubbles: true }));
      const projectedRun = waitForEvent(testApp, (next, status, result) => status === 'complete' && result); testUi.getElementById('run-query').click(); const projectedResult = await projectedRun;
      check('selected source and successive projection edits shape actual query output', testApp.getState().builder.source.kind === 'items' && JSON.stringify(testApp.getState().builder.source.path) === '["records"]' && testApp.getState().builder.projection[0].name === 'displayName' && projectedResult.result.outputText.includes('"displayName":"Ada"'));
      testUi.getElementById('custom-mode').click(); testUi.getElementById('custom-filter').value = 'range(0; 1002)'; testUi.getElementById('custom-filter').dispatchEvent(new verifyFrame.contentWindow.Event('input', { bubbles: true }));
      const truncatedEvent = waitForEvent(testApp, (next, status, result) => status === 'truncated' && result); testUi.getElementById('run-query').click(); const truncatedResult = await truncatedEvent;
      check('truncated result warning is visible and result is marked incomplete', !testUi.getElementById('run-warning').hidden && testUi.getElementById('run-status').dataset.state === 'truncated' && truncatedResult.result.complete === false && /truncated/i.test(testUi.getElementById('run-warning').textContent));
      check('JQApp exposes the requested methods', app && ['getState', 'setInput', 'setBuilder', 'setMode', 'setCustomFilter', 'setCollect', 'run', 'cancel', 'subscribe'].every((name) => typeof app[name] === 'function'));
      app.setInput('1', 'jsonl'); app.setBuilder({ source: { kind: 'root', path: [] }, condition: { kind: 'group', op: 'and', children: [] }, steps: [], projection: null }); app.setCollect(false); app.setMode('custom'); app.setCustomFilter('.');

      let state = app.getState();
      const originalRevision = state.revision;
      state.inputText = 'mutated copy';
      check('getState returns a copy', app.getState().inputText !== 'mutated copy');

      let event = waitForEvent(app, (next, status) => next.revision > originalRevision && status === 'stale');
      app.setInput('1', 'jsonl');
      await event;
      check('changing input increments revision and invalidates results', app.getState().revision === originalRevision + 1, JSON.stringify(app.getState()));

      app.setMode('custom');
      app.setCustomFilter('.');
      const first = await app.run();
      check('a simple run completes with current output', first.status === 'ok' && first.outputText === '1' && first.complete === true, JSON.stringify(first));

      const afterRun = app.getState();
      event = waitForEvent(app, (next, status, result) => status === 'stale' && result === null);
      app.setCustomFilter('., error("stale")');
      await event;
      check('changing the filter invalidates the previous result', app.getState().revision > afterRun.revision, JSON.stringify(app.getState()));

      const partial = await app.run();
      check('runtime error after output is incomplete', partial.status === 'error' && partial.complete === false && partial.valueCount === 1 && partial.outputText === '1', JSON.stringify(partial));

      const builder = {
        source: { kind: 'root', path: [] },
        condition: { kind: 'leaf', path: [], op: 'regex', value: '[', flags: '' },
        steps: [], projection: null
      };
      app.setInput('', 'jsonl');
      app.setBuilder(builder);
      app.setMode('builder');
      const invalidRegex = await app.run();
      check('invalid generated regex fails before an empty stream runs', invalidRegex.status === 'error' && invalidRegex.error && invalidRegex.error.stage === 'regex', JSON.stringify(invalidRegex));

      let rejected = false;
      try { app.setInput('x'.repeat(5 * 1024 * 1024 + 1), 'jsonl'); } catch (error) { rejected = error && error.code === 'INPUT_TOO_LARGE'; }
      check('input over 5 MiB UTF-8 bytes is rejected on the main thread', rejected);

      app.setInput('1', 'jsonl');
      app.setMode('custom');
      app.setCustomFilter('range(0; 1000000000000)');
      const timeoutRun = await app.run();
      check('a long run times out at the production default', timeoutRun.status === 'timeout' && timeoutRun.complete === false, JSON.stringify(timeoutRun));

      app.setCustomFilter('.');
      const recovery = await app.run();
      check('a timed-out worker is recreated for the next run', recovery.status === 'ok' && recovery.outputText === '1', JSON.stringify(recovery));

      app.setCustomFilter('range(0; 1000000000000)');
      const superseded = app.run();
      app.setCustomFilter('.');
      const current = await app.run();
      const old = await superseded;
      check('cancelled or older run replies cannot replace current output', current.status === 'ok' && current.outputText === '1' && old.status === 'cancelled', JSON.stringify({ old, current }));

      const harness = await controllerHarness();
      const fakeApp = harness.app;
      const malformedBuilder = JSON.stringify(fakeApp.getState().builder);
      let malformedAccepted = true;
      try { fakeApp.setInput('{', 'json'); } catch (error) { malformedAccepted = false; }
      const malformedState = fakeApp.getState();
      const malformedResult = await fakeApp.run();
      check('malformed input remains editable until Run', malformedAccepted && malformedState.inputText === '{' && malformedResult.status === 'error' && malformedResult.error.stage === 'input' && JSON.stringify(malformedState.builder) === malformedBuilder, JSON.stringify(malformedResult));

      const exactFiveMiB = '\u00e9'.repeat(2621440);
      let exactAccepted = true;
      try { fakeApp.setInput(exactFiveMiB, 'jsonl'); } catch (error) { exactAccepted = false; }
      let aboveRejected = false;
      try { fakeApp.setInput(exactFiveMiB + 'x', 'jsonl'); } catch (error) { aboveRejected = error && error.code === 'INPUT_TOO_LARGE'; }
      check('UTF-8 input accepts exactly 5 MiB and rejects one byte above', exactAccepted && aboveRejected && fakeApp.getState().inputText === exactFiveMiB, JSON.stringify({ exactAccepted, aboveRejected }));

      fakeApp.setInput('1', 'jsonl');
      const atomicEvents = [];
      const removeAtomic = fakeApp.subscribe((nextState, status, nextResult) => atomicEvents.push({ revision: nextState.revision, inputText: nextState.inputText, status, result: nextResult }));
      const atomicRun = fakeApp.run();
      const atomicWorker = harness.workers[harness.workers.length - 1];
      atomicEvents.length = 0;
      fakeApp.setInput('2', 'jsonl');
      const atomicCancelled = await atomicRun;
      removeAtomic();
      check('state mutation and cancellation publish one coherent transition', atomicCancelled.status === 'cancelled' && atomicEvents.length === 1 && atomicEvents[0].revision === fakeApp.getState().revision && atomicEvents[0].inputText === '2' && atomicEvents[0].status === 'stale' && atomicEvents[0].result === null && atomicWorker.terminated, JSON.stringify({ atomicCancelled, atomicEvents }));

      const lateEvents = [];
      const removeLate = fakeApp.subscribe((nextState, status, nextResult) => lateEvents.push({ status, result: nextResult }));
      const newerRun = fakeApp.run();
      const newerWorker = harness.workers[harness.workers.length - 1];
      newerWorker.reply({ type: 'result', id: newerWorker.request.id, revision: newerWorker.request.revision, status: 'ok', outputText: 'newer', valueCount: 1 });
      const newerResult = await newerRun;
      const lateCount = lateEvents.length;
      const newerEvent = JSON.stringify(lateEvents[lateEvents.length - 1]);
      atomicWorker.reply({ type: 'result', id: atomicWorker.request && atomicWorker.request.id, revision: atomicWorker.request && atomicWorker.request.revision, status: 'ok', outputText: '999', valueCount: 1 });
      check('late reply cannot replace a newer published result', newerResult.status === 'ok' && newerResult.outputText === 'newer' && lateEvents.length === lateCount && JSON.stringify(lateEvents[lateEvents.length - 1]) === newerEvent, JSON.stringify({ lateCount, newerEvent, afterLate: lateEvents[lateEvents.length - 1] }));
      removeLate();

      const cancelEvents = [];
      const removeCancel = fakeApp.subscribe((nextState, status, nextResult) => cancelEvents.push({ status, result: nextResult }));
      const cancelRun = fakeApp.run();
      const cancelWorker = harness.workers[harness.workers.length - 1];
      const cancelled = fakeApp.cancel();
      const cancelCount = cancelEvents.length;
      const cancelledEvent = JSON.stringify(cancelEvents[cancelEvents.length - 1]);
      cancelWorker.reply({ type: 'result', id: cancelWorker.request.id, revision: cancelWorker.request.revision, status: 'ok', outputText: 'orphan', valueCount: 1 });
      const cancelResult = await cancelRun;
      check('explicit cancel stays cancelled after a late reply', cancelled.status === 'cancelled' && cancelResult.status === 'cancelled' && cancelWorker.terminated && cancelEvents.length === cancelCount && JSON.stringify(cancelEvents[cancelEvents.length - 1]) === cancelledEvent && cancelEvents[cancelEvents.length - 1].result.status === 'cancelled', JSON.stringify({ cancelCount, cancelledEvent, afterCancel: cancelEvents[cancelEvents.length - 1] }));
      removeCancel();

      const errorRun = fakeApp.run();
      const errorWorker = harness.workers[harness.workers.length - 1];
      errorWorker.fail('synthetic worker failure');
      const workerError = await errorRun;
      const recoveryRun = fakeApp.run();
      const recoveryWorker = harness.workers[harness.workers.length - 1];
      recoveryWorker.reply({ type: 'result', id: recoveryWorker.request.id, revision: recoveryWorker.request.revision, status: 'ok', outputText: '2', valueCount: 1 });
      const workerRecovery = await recoveryRun;
      check('worker error is recoverable on the next run', workerError.status === 'error' && workerError.error.stage === 'runtime' && workerRecovery.status === 'ok' && workerRecovery.outputText === '2', JSON.stringify({ workerError, workerRecovery }));

      const fakeTimeoutRun = fakeApp.run();
      const timeoutWorker = harness.workers[harness.workers.length - 1];
      const timeoutTimer = harness.timers[harness.timers.length - 1];
      check('production timeout is scheduled for exactly 5000 ms', timeoutTimer.delay === 5000, String(timeoutTimer.delay));
      harness.fireTimer(timeoutTimer);
      const timedOut = await fakeTimeoutRun;
      check('test timer can drive timeout and terminate its worker', timedOut.status === 'timeout' && timeoutWorker.terminated, JSON.stringify(timedOut));

      const reentrantHarness = await controllerHarness();
      let reentrantRun;
      reentrantHarness.app.subscribe((nextState, status) => {
        if (status === 'running') reentrantHarness.app.cancel();
      });
      reentrantRun = reentrantHarness.app.run();
      const reentrantResult = await reentrantRun;
      check('reentrant subscriber cancellation cannot post orphan work', reentrantResult.status === 'cancelled' && reentrantHarness.workers[0].postCount === 0 && reentrantHarness.workers[0].terminated, JSON.stringify(reentrantResult));
    } catch (error) {
      check('controller harness completes', false, String(error));
    } finally {
      const failed = checks.filter((item) => !item.pass);
      details.textContent = checks.map((item) => `${item.pass ? 'PASS' : 'FAIL'} ${item.name}${item.evidence ? `: ${item.evidence}` : ''}`).join('\n');
      summary.textContent = failed.length === 0 ? `PASS (${checks.length} checks)` : `FAIL (${failed.length}/${checks.length} checks failed)`;
      document.documentElement.dataset.testComplete = 'true';
    }
  }

  main();
})();
