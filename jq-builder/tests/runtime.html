<!doctype html>
<meta charset="utf-8">
<title>jq runtime smoke tests</title>
<h1>jq runtime smoke tests</h1>
<pre id="test-summary">FAIL</pre>
<pre id="test-details"></pre>
<script>
(() => {
  const summary = document.querySelector('#test-summary');
  const details = document.querySelector('#test-details');
  const checks = [];
  const worker = new Worker('../worker.js', { type: 'module' });
  let nextId = 0;

  function check(name, condition, evidence) {
    checks.push({ name, pass: Boolean(condition), evidence: evidence || '' });
  }

  function run(request) {
    return new Promise((resolve, reject) => {
      const id = `runtime-${++nextId}`;
      const timeout = setTimeout(() => {
        worker.removeEventListener('message', onMessage);
        reject(new Error(`timed out waiting for ${id}`));
      }, 3000);
      const onMessage = (event) => {
        if (event.data && event.data.id === id) {
          clearTimeout(timeout);
          worker.removeEventListener('message', onMessage);
          resolve(event.data);
        }
      };
      worker.addEventListener('message', onMessage);
      worker.postMessage({ ...request, id, revision: nextId });
    });
  }

  async function main() {
    try {
      const coreHtml = await fetch('../index.html').then((response) => response.text());
      const coreMatch = coreHtml.match(/<script id="jq-core">([\s\S]*?)<\/script>/);
      if (!coreMatch) throw new Error('jq-core script was not found');
      Function(coreMatch[1])();
      const core = globalThis.JQCore;
      const limits = { inputBytes: 5242880, outputBytes: 1048576, outputValues: 1000 };

      const literalBuilder = core.compileBuilder({
        source: { kind: 'root', path: [] },
        condition: { kind: 'leaf', path: ['a.b'], op: 'eq', value: 'yes' },
        steps: [],
        projection: [
          { path: ['"'], name: 'quote' },
          { path: ['__proto__'], name: 'proto' },
          { path: [0], name: 'zero' },
          { path: [''], name: 'empty' }
        ]
      });
      const literalInput = core.normalizeInput('{"a.b":"yes","\\\"":1,"__proto__":2,"0":"wrong"}', 'json');
      const literal = await run({
        type: 'run', input: literalInput.text,
        filter: core.effectiveFilter(literalBuilder.filter, false),
        regexChecks: literalBuilder.regexChecks, limits
      });
      check('browser compiler preserves literal paths', literal.status === 'ok' && literal.outputText === '{"quote":1,"proto":2,"zero":null,"empty":null}', JSON.stringify(literal));

      const conditionBuilder = core.compileBuilder({
        source: { kind: 'root', path: [] },
        condition: { kind: 'group', op: 'and', children: [
          { kind: 'group', op: 'or', children: [
            { kind: 'leaf', path: ['kind'], op: 'eq', value: 'a' },
            { kind: 'leaf', path: ['kind'], op: 'eq', value: 'b' }
          ] },
          { kind: 'group', op: 'not', children: [{ kind: 'leaf', path: ['name'], op: 'regex', value: '^no', flags: 'i' }] }
        ] },
        steps: [], projection: null
      });
      const condition = await run({
        type: 'run', input: '{"kind":"a","name":"yes"}\n{"kind":"b","name":"nope"}',
        filter: core.effectiveFilter(conditionBuilder.filter, false),
        regexChecks: conditionBuilder.regexChecks, limits
      });
      check('browser compiler preserves nested conditions and regex flags', condition.status === 'ok' && condition.outputText === '{"kind":"a","name":"yes"}', JSON.stringify(condition));

      const orderingBuilder = core.compileBuilder({
        source: { kind: 'root', path: [] },
        condition: { kind: 'leaf', path: ['name'], op: 'lt', value: 'm' },
        steps: [], projection: null
      });
      const ordering = await run({
        type: 'run', input: '{"name":"a"}\n{"name":"z"}\n{"name":1}',
        filter: core.effectiveFilter(orderingBuilder.filter, false),
        regexChecks: orderingBuilder.regexChecks, limits
      });
      check('browser compiler orders same-type strings only', ordering.status === 'ok' && ordering.outputText === '{"name":"a"}', JSON.stringify(ordering));

      async function runGenerated(name, builder, input, expected, format) {
        const compiled = core.compileBuilder(builder);
        const normalized = core.normalizeInput(input, format || 'jsonl');
        const result = await run({
          type: 'run', input: normalized.text,
          filter: core.effectiveFilter(compiled.filter, false),
          regexChecks: compiled.regexChecks, limits
        });
        check(name, result.status === 'ok' && result.outputText === expected, JSON.stringify(result));
      }

      await runGenerated('browser compiler distinguishes present null from missing', {
        source: { kind: 'root', path: [] },
        condition: { kind: 'leaf', path: ['a'], op: 'null' }, steps: [], projection: null
      }, '{"a":null}\n{}', '{"a":null}');
      await runGenerated('browser compiler selects missing paths only', {
        source: { kind: 'root', path: [] },
        condition: { kind: 'leaf', path: ['a'], op: 'missing' }, steps: [], projection: null
      }, '{"a":null}\n{}', '{}');
      await runGenerated('browser compiler applies any and all empty-array semantics', {
        source: { kind: 'root', path: [] },
        condition: { kind: 'group', op: 'or', children: [
          { kind: 'leaf', path: ['items'], op: 'any', child: { kind: 'leaf', path: [], op: 'eq', value: 1 } },
          { kind: 'leaf', path: ['items'], op: 'all', child: { kind: 'leaf', path: [], op: 'eq', value: 1 } }
        ] }, steps: [], projection: null
      }, '{"items":[]}\n{"items":[1,2]}\n{"items":1}', '{"items":[]}\n{"items":[1,2]}');
      await runGenerated('browser compiler rejects any and all non-arrays', {
        source: { kind: 'root', path: [] },
        condition: { kind: 'leaf', path: ['items'], op: 'any', child: { kind: 'leaf', path: [], op: 'eq', value: 1 } },
        steps: [], projection: null
      }, '{"items":1}', '');
      await runGenerated('browser compiler selects nested source items', {
        source: { kind: 'items', path: ['groups', 0, 'items'] },
        condition: { kind: 'leaf', path: ['v'], op: 'eq', value: 2 }, steps: [], projection: null
      }, '{"groups":[{"items":[{"v":1},{"v":2}]}]}', '{"v":2}');
      await runGenerated('browser compiler preserves zero-match capture updates', {
        source: { kind: 'root', path: [] }, condition: { kind: 'group', op: 'and', children: [] },
        steps: [{ op: 'capture', path: ['text'], mode: 'update', pattern: '(?<x>a)', flags: '' }], projection: null
      }, '{"text":"zzz"}', '{"text":"zzz"}');
      await runGenerated('browser compiler replaces one capture update', {
        source: { kind: 'root', path: [] }, condition: { kind: 'group', op: 'and', children: [] },
        steps: [{ op: 'capture', path: ['text'], mode: 'update', pattern: '(?<x>a)', flags: '' }], projection: null
      }, '{"text":"a"}', '{"text":{"x":"a"}}');
      await runGenerated('browser compiler feeds emitted values into ordered steps', {
        source: { kind: 'root', path: [] }, condition: { kind: 'group', op: 'and', children: [] },
        steps: [
          { op: 'capture', path: ['text'], mode: 'emit', pattern: '(?<x>a)', flags: '' },
          { op: 'sub', path: ['x'], mode: 'update', pattern: 'a', flags: '', replacement: 'z' }
        ], projection: null
      }, '{"text":"a"}', '{"x":"z"}');
      await runGenerated('browser compiler projects missing paths as null', {
        source: { kind: 'root', path: [] }, condition: { kind: 'group', op: 'and', children: [] }, steps: [],
        projection: [{ path: ['missing'], name: 'alias' }]
      }, '{}', '{"alias":null}');
      await runGenerated('browser compiler runs generated replacement interpolation', {
        source: { kind: 'root', path: [] }, condition: { kind: 'group', op: 'and', children: [] },
        steps: [{ op: 'sub', path: [], mode: 'emit', pattern: '(?<x>a)', flags: '', replacement: '\\(.x)-literal' }], projection: null
      }, '"a"', '"a-literal"', 'json');

      const captureBuilder = core.compileBuilder({
        source: { kind: 'root', path: [] },
        condition: { kind: 'group', op: 'and', children: [] },
        steps: [{ op: 'capture', path: ['text'], mode: 'update', pattern: '(?<x>a)', flags: 'g' }],
        projection: null
      });
      const capture = await run({
        type: 'run', input: '{"id":1,"text":"aba"}',
        filter: core.effectiveFilter(captureBuilder.filter, false),
        regexChecks: captureBuilder.regexChecks, limits
      });
      check('browser compiler preserves many-match capture updates', capture.status === 'ok' && capture.outputText === '{"id":1,"text":[{"x":"a"},{"x":"a"}]}', JSON.stringify(capture));

      const invalidTargetBuilder = core.compileBuilder({
        source: { kind: 'root', path: [] },
        condition: { kind: 'group', op: 'and', children: [] },
        steps: [{ op: 'capture', path: [], mode: 'update', pattern: '(?<x>a)', flags: '' }],
        projection: null
      });
      const invalidTarget = await run({
        type: 'run', input: 'null',
        filter: core.effectiveFilter(invalidTargetBuilder.filter, false),
        regexChecks: invalidTargetBuilder.regexChecks, limits
      });
      check('browser compiler errors on invalid transformation targets', invalidTarget.status === 'error' && invalidTarget.error && invalidTarget.error.stage === 'filter' && invalidTarget.error.message.includes('transformation target must be a string'), JSON.stringify(invalidTarget));

      const emitNoMatchBuilder = core.compileBuilder({
        source: { kind: 'root', path: [] },
        condition: { kind: 'group', op: 'and', children: [] },
        steps: [{ op: 'capture', path: [], mode: 'emit', pattern: '(?<x>a)', flags: '' }],
        projection: null
      });
      const emitNoMatch = await run({
        type: 'run', input: JSON.stringify('zzz'),
        filter: core.effectiveFilter(emitNoMatchBuilder.filter, false),
        regexChecks: emitNoMatchBuilder.regexChecks, limits
      });
      check('browser compiler emits zero values for valid zero-match strings', emitNoMatch.status === 'ok' && emitNoMatch.outputText === '', JSON.stringify(emitNoMatch));

      const collectedInput = core.normalizeInput('1\n2', 'jsonl');
      const collected = await run({
        type: 'run', input: collectedInput.text, filter: core.effectiveFilter('.', true),
        regexChecks: [], limits
      });
      check('browser compiler collects JSONL values once', collected.status === 'ok' && collected.outputText === '[1,2]', JSON.stringify(collected));

      const regex = await run({
        type: 'run',
        input: JSON.stringify('abc'),
        filter: `[inputs | [
          test("AbC";"i"),
          ("abc" | match("a")),
          ("Ada" | capture("(?<name>Ada)")),
          ("abc abc" | sub("abc"; "X")),
          ("abc abc" | gsub("abc"; "X")),
          ("\\u03bb" | [., test("\\u03bb")]),
          ("abc" | sub("(?<x>a)"; "\\(.x)-\\(.x)")),
          ("AbC" | test("abc"; "i"))
        ]]`,
        regexChecks: [
          { pattern: 'a', flags: '' },
          { pattern: '(?<name>Ada)', flags: '' }
        ],
        limits
      });
      check('test("AbC";"i") is true', regex.status === 'ok' && regex.outputText.includes('[true,'), JSON.stringify(regex));
      check('match("a") exposes offset and string', regex.status === 'ok' && regex.outputText.includes('"offset":0') && regex.outputText.includes('"string":"a"'), regex.outputText);
      check('named capture extracts name', regex.status === 'ok' && regex.outputText.includes('"name":"Ada"'), regex.outputText);
      check('sub replaces once', regex.status === 'ok' && regex.outputText.includes('"X abc"'), regex.outputText);
      check('gsub replaces all', regex.status === 'ok' && regex.outputText.includes('"X X"'), regex.outputText);
      check('escaped Unicode works', regex.status === 'ok' && JSON.parse(regex.outputText)[0][5][0] === '\u03bb' && JSON.parse(regex.outputText)[0][5][1] === true, regex.outputText);
      check('replacement interpolation works', regex.status === 'ok' && regex.outputText.includes('"a-abc"'), regex.outputText);
      check('regex flags work', regex.status === 'ok' && regex.outputText.endsWith('true]]'), regex.outputText);

      const stderrSuccess = await run({
        type: 'run',
        input: '1\n',
        filter: 'inputs | debug',
        regexChecks: [],
        limits
      });
      check('successful jq stderr does not fail the run', stderrSuccess.status === 'ok' && stderrSuccess.outputText === '1', JSON.stringify(stderrSuccess));

      const invalid = await run({
        type: 'run',
        input: JSON.stringify('abc'),
        filter: '.',
        regexChecks: [{ pattern: '[', flags: '' }],
        limits
      });
      check('invalid regex reports an error', invalid.status === 'error' && invalid.error && invalid.error.stage === 'regex', JSON.stringify(invalid));

      const stream = await run({
        type: 'run',
        input: '{"n":1}\n{"n":2}\n',
        filter: 'inputs | .n',
        regexChecks: [],
        limits
      });
      check('inputs consumes multiple values exactly once', stream.status === 'ok' && stream.outputText === '1\n2', JSON.stringify(stream));

      const empty = await run({
        type: 'run',
        input: '',
        filter: '[inputs]',
        regexChecks: [],
        limits
      });
      check('inputs accepts an empty stream', empty.status === 'ok' && empty.outputText === '[]', JSON.stringify(empty));

      const utf8 = await run({
        type: 'run',
        input: JSON.stringify('\u00e9'),
        filter: 'inputs',
        regexChecks: [],
        limits: { inputBytes: 4, outputBytes: 4, outputValues: 1000 }
      });
      check('UTF-8 input and output use byte limits', utf8.status === 'ok' && utf8.outputText === '"\u00e9"' && new TextEncoder().encode(utf8.outputText).byteLength === 4, JSON.stringify(utf8));

      const utf8InputCapped = await run({
        type: 'run',
        input: JSON.stringify('\u00e9'),
        filter: 'inputs',
        regexChecks: [],
        limits: { inputBytes: 3, outputBytes: 1048576, outputValues: 1000 }
      });
      check('UTF-8 input rejects one byte below its limit', utf8InputCapped.status === 'error' && utf8InputCapped.error && utf8InputCapped.error.stage === 'input', JSON.stringify(utf8InputCapped));

      const utf8OutputCapped = await run({
        type: 'run',
        input: JSON.stringify('\u00e9'),
        filter: 'inputs',
        regexChecks: [],
        limits: { inputBytes: 4, outputBytes: 3, outputValues: 1000 }
      });
      check('UTF-8 output truncates when bytes exceed its limit', utf8OutputCapped.status === 'truncated' && utf8OutputCapped.outputText === '' && new TextEncoder().encode('"\u00e9"').byteLength > 3, JSON.stringify(utf8OutputCapped));

      const byteCapped = await run({
        type: 'run',
        input: '1\n22\n',
        filter: 'inputs',
        regexChecks: [],
        limits: { inputBytes: 5242880, outputBytes: 3, outputValues: 1000 }
      });
      check('output byte cap truncates UTF-8 output', byteCapped.status === 'truncated' && byteCapped.outputText === '1' && new TextEncoder().encode(byteCapped.outputText).byteLength <= 3, JSON.stringify(byteCapped));

      const capped = await run({
        type: 'run',
        input: '{"n":1}\n{"n":2}\n',
        filter: 'inputs | .n',
        regexChecks: [],
        limits: { inputBytes: 5242880, outputBytes: 1048576, outputValues: 1 }
      });
      check('output value cap labels buffered truncation', capped.status === 'truncated' && capped.outputText === '1' && capped.valueCount === 1, JSON.stringify(capped));

      const errorAfterOutput = await run({
        type: 'run',
        input: '1\n2\n3\n',
        filter: 'inputs, error(("x" * 10000))',
        regexChecks: [],
        limits: { inputBytes: 5242880, outputBytes: 3, outputValues: 2 }
      });
      check('error after output returns capped incomplete preview', errorAfterOutput.status === 'error' && errorAfterOutput.outputText === '1\n2' && errorAfterOutput.valueCount === 2 && new TextEncoder().encode(errorAfterOutput.outputText).byteLength <= 3 && errorAfterOutput.error && new TextEncoder().encode(errorAfterOutput.error.message).byteLength <= 4096, JSON.stringify(errorAfterOutput));
    } catch (error) {
      check('worker protocol completes', false, String(error));
    } finally {
      worker.terminate();
      const failed = checks.filter((item) => !item.pass);
      details.textContent = checks.map((item) => `${item.pass ? 'PASS' : 'FAIL'} ${item.name}${item.evidence ? `: ${item.evidence}` : ''}`).join('\n');
      summary.textContent = failed.length === 0 ? `PASS (${checks.length} checks)` : `FAIL (${failed.length}/${checks.length} checks failed)`;
      document.documentElement.dataset.testComplete = 'true';
    }
  }

  worker.addEventListener('error', (event) => {
    check('worker loads', false, event.message || 'worker failed to load');
  }, { once: true });
  main();
})();
</script>
